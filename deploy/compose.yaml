name: xingtu-f04-f05
services:
  app-postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: xingtu_app
      POSTGRES_DB: xingtu_development
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?run make setup}
    ports: ['127.0.0.1:55432:5432']
    volumes: ['app-db:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xingtu_app -d xingtu_development']
      interval: 5s
      timeout: 5s
      retries: 20
  temporal-postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?run make setup}
    volumes: ['temporal-db:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 5s
      timeout: 5s
      retries: 20
  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      temporal-postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?run make setup}
      POSTGRES_SEEDS: temporal-postgres
    ports: ['127.0.0.1:57233:7233']
  redis:
    image: redis:7.4.5-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:56379:6379']
  objects:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: xingtu_dev
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?run make setup}
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    volumes: ['objects:/data']
volumes:
  app-db:
  temporal-db:
  objects:
