name: xingtu-production

x-logging: &default-logging
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-app: &app
  image: ${XINGTU_APP_IMAGE:-xingtu-app:local}
  build: {context: .., dockerfile: deploy/Dockerfile.app}
  env_file:
    - "${XINGTU_ENV_FILE:-./production.env}"
  restart: unless-stopped
  logging: *default-logging
  networks: [app-egress, data]

services:
  app-postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: xingtu_app
      POSTGRES_DB: xingtu_production
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    ports: ["${PRIVATE_BIND_IP:?set the server Tailscale IP}:5432:5432"]
    volumes: [app-db:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U xingtu_app -d xingtu_production]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    # Docker does not publish host ports for a container attached only to an
    # internal network. The second network enables the Tailscale-bound host
    # listener; application traffic remains on the isolated data network.
    networks: [data, private-access]
    mem_limit: ${APP_POSTGRES_MEMORY_LIMIT:-384m}

  temporal-postgres:
    image: postgres:16.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
    volumes: [temporal-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U temporal -d temporal]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks: [data]
    mem_limit: ${TEMPORAL_POSTGRES_MEMORY_LIMIT:-384m}

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    depends_on:
      temporal-postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?set TEMPORAL_DB_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres
      # The server is attached to both the isolated data network and the
      # Tailscale-bound access network. Listen on both container interfaces;
      # host publication remains restricted by PRIVATE_BIND_IP.
      BIND_ON_IP: 0.0.0.0
    ports: ["${PRIVATE_BIND_IP:?set the server Tailscale IP}:7233:7233"]
    healthcheck:
      test: [CMD, tctl, --address, temporal:7233, cluster, health]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    logging: *default-logging
    networks: [data, private-access]
    mem_limit: ${TEMPORAL_MEMORY_LIMIT:-768m}

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: [/bin/sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks: [data]
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}

  objects:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "${PRIVATE_BIND_IP:?set the server Tailscale IP}:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: [objects:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks: [data, private-access]
    mem_limit: ${MINIO_MEMORY_LIMIT:-384m}

  objects-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      objects: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_WORKER_USER: ${MINIO_WORKER_USER:?set MINIO_WORKER_USER}
      MINIO_WORKER_PASSWORD: ${MINIO_WORKER_PASSWORD:?set MINIO_WORKER_PASSWORD}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        mc alias set local http://objects:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing local/xingtu-covers;
        mc anonymous set none local/xingtu-covers;
        mc admin user add local "$$MINIO_WORKER_USER" "$$MINIO_WORKER_PASSWORD" || true;
        mc admin policy attach local readwrite --user "$$MINIO_WORKER_USER"
    restart: "no"
    logging: *default-logging
    networks: [data]

  migration:
    <<: *app
    command: [xingtu, migrate, --environment, production]
    restart: "no"
    depends_on:
      app-postgres: {condition: service_healthy}
    mem_limit: ${MIGRATION_MEMORY_LIMIT:-384m}

  api:
    <<: *app
    command: [xingtu-api]
    depends_on:
      migration: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      temporal: {condition: service_healthy}
      objects-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${API_BIND_PORT:-8000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: ${API_MEMORY_LIMIT:-320m}

  intake-worker:
    <<: *app
    command:
      - xingtu-product
      - intake-worker
      - --execution-unit-id
      - ${XINGTU_DEFAULT_EXECUTION_UNIT_ID:-unit-mac-cell-01}
      - --registry
      - /app/contracts/douyin_xingtu.verified.json
      - --profile-requirement
      - /app/contracts/profile_requirements.json
    depends_on:
      migration: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
    mem_limit: ${INTAKE_MEMORY_LIMIT:-512m}

  update-scheduler:
    <<: *app
    command:
      - xingtu-product
      - update-scheduler
      - --registry
      - /app/contracts/douyin_xingtu.verified.json
      - --profile-requirement
      - /app/contracts/profile_requirements.json
    depends_on:
      migration: {condition: service_completed_successfully}
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-256m}

networks:
  app-egress:
  private-access:
  data: {internal: true}

volumes:
  app-db:
  temporal-db:
  redis-data:
  objects:
