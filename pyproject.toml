[project]
name = "xingtu-collector"
version = "0.1.0"
description = "F04/F05 isolated collection worker; live contracts gated by verification"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11,<3", "psycopg[binary]>=3.2,<4",
  "temporalio>=1.12,<2", "playwright>=1.55,<2",
  "boto3>=1.40,<2", "redis>=6,<7",
  "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1",
  "argon2-cffi>=25,<26", "langgraph>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.17,<2", "boto3-stubs[s3]>=1.40,<2"]

[project.scripts]
xingtu = "xingtu.cli:main"
xingtu-api = "xingtu.product_cli:run_api"
xingtu-product = "xingtu.product_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/xingtu"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests/e2e"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The UI-01 acceptance drivers embed browser JavaScript as single-line expressions inside Python
# string literals; wrapping those lines would change the evaluated code.
"scripts/acceptance/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["backend/src"]
strict = true
